services:
  voice-assistant:
    container_name: voice-assistant-1
    image: voice-assistant:local
    build: .
    depends_on:
      - deepseek-harness
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      PTT_QUERY_BACKEND: deepseek-harness
      PTT_HARNESS_API_URL: http://deepseek-harness:3080
      PTT_HARNESS_AGENT_PRESET: memo-minimal
      PTT_HARNESS_TIMEOUT_SECONDS: "10"
      PTT_HARNESS_ASYNC_TIMEOUT_SECONDS: "60"
      PTT_REMEMBER_BACKEND: mem0
      PTT_CHAT_HARNESS_AGENT_PRESET: chat-fast
      PTT_CHAT_TIMEOUT_SECONDS: "30"
      PTT_REMINDER_STORE_PATH: /app/data/reminders.json
    ports:
      - "10031:10031"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  deepseek-harness:
    container_name: deepseek-harness
    image: deepseek-harness:local
    build:
      context: .
      dockerfile: Dockerfile.dsh
    env_file:
      - path: ./config/deepseek-harness/runtime/.env
        required: false
    environment:
      DSH_HOME: /root/.dsh
      DSH_WEB_PORT: 3080
      # The Harness container is disposable and the minimal agent needs one
      # network-enabled shell command. Avoid requiring a sandbox runner inside
      # this isolated container.
      DSH_PERMISSION_MODE: danger-full-access
      MEM0_REQUEST_TIMEOUT_SECONDS: "3"
      REMINDER_API_URL: http://voice-assistant:10031
      PTT_API_KEY: ${PTT_API_KEY}
    command:
      - --host
      - 0.0.0.0
      - --port
      - "3080"
      - --trusted-host
      - deepseek-harness
      - --trusted-host
      - docker.home
      - --trusted-host
      - deepseek-harness.docker.home
    volumes:
      - ./config/deepseek-harness/runtime:/root/.dsh
      - ./config/deepseek-harness/agent-presets/memo-minimal:/root/.dsh/.agent-presets/memo-minimal
      - ./config/deepseek-harness/agent-presets/memo-mem0:/root/.dsh/.agent-presets/memo-mem0
      - ./config/deepseek-harness/agent-presets/chat-fast:/root/.dsh/.agent-presets/chat-fast
    ports:
      - "3080:3080"
    restart: unless-stopped

  memo-web:
    container_name: memo-web
    image: voice-assistant:local
    depends_on:
      - deepseek-harness
    environment:
      TZ: Asia/Shanghai
      PTT_HARNESS_API_URL: http://deepseek-harness:3080
      PTT_HARNESS_AGENT_PRESET: memo-minimal
      PTT_HARNESS_TIMEOUT_SECONDS: "10"
    entrypoint: ["uv"]
    command:
      - run
      - --no-sync
      - ptt-memo-web
      - --host
      - 0.0.0.0
      - --port
      - "10032"
    ports:
      - "10032:10032"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:10032/health"]
      interval: 30s
      timeout: 5s
      retries: 3
