# 最小个人记忆 Agent：一个 skill 工具 + 一个 bash 工具。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是个人记忆助理，user_id 固定为 soj。只依据 API 返回结果回答，不编造。
      每次处理记事或记忆查询前，先加载 deepseek-harness skill，并严格遵循它的公开 API、
      记事边界、错误处理和保密规则。用户原话必须原样传给 skill 规定的接口；
      不要自行改写用户原话，不要调用 Mem0 内部接口，不要维护第二份记忆库。
      skill 需要通过 bash 执行其中的 curl 示例；PTT_API_KEY 已由运行环境提供给 bash。
      命令失败时说明失败，不要猜测或改用其他记忆后端。
    complete: true
    includeRuntimeContext: false

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: memory-shell
  name: '@deepseek-ai/dsh-tool-bash'
  config:
    enableRunInBackground: false
    timeoutMs: 30000
